name: checker-regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
env:
  CHECKER_TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify exact clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKER_TESTED_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git status --porcelain=v1)"
          echo "CHECKER_CHECKOUT_PROOF=$RUNNER_TEMP/checker-checkout.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify event, schedule and accepted identities without provisioning
        run: python -B tools/ci.py checkout
  focused:
    if: github.event_name == 'pull_request'
    needs: fast-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      CHECKER_SHARD: ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [A, B, C]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify actual checkout before execution
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKER_TESTED_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git status --porcelain=v1)"
          mkdir -p "$RUNNER_TEMP/checker-tmp" "$RUNNER_TEMP/checker-pip"
          echo "CHECKER_CHECKOUT_PROOF=$RUNNER_TEMP/checker-checkout.json" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/checker-tmp" >> "$GITHUB_ENV"
          echo "PIP_CACHE_DIR=$RUNNER_TEMP/checker-pip" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B tools/ci.py checkout
      - run: python -m pip install -r requirements.txt
      - name: Provision pinned external source
        timeout-minutes: 3
        shell: bash
        run: |
          umask 077
          phase_log="$RUNNER_TEMP/checker-provision-$CHECKER_SHARD.log"
          : > "$phase_log"
          printf 'START phase=provision shard=%s utc=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)"
          finish() {
            phase_rc=$?
            trap - EXIT
            printf 'END phase=provision shard=%s utc=%s exit=%s bytes=%s sha256=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)" "$phase_rc" "$(wc -c < "$phase_log")" "$(sha256sum -- "$phase_log" | cut -d ' ' -f1)"
            exit "$phase_rc"
          }
          trap finish EXIT
          timeout --signal=TERM --kill-after=15s 150s python -B tools/provision.py --destination "$RUNNER_TEMP/checker-runtime" > "$phase_log" 2>&1
      - name: Seed private source-rendered controls
        timeout-minutes: 5
        shell: bash
        working-directory: ${{ runner.temp }}/checker-runtime
        env:
          TMPDIR: ${{ runner.temp }}/checker-runtime/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/checker-runtime/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/checker-runtime/cache/config
          MPLCONFIGDIR: ${{ runner.temp }}/checker-runtime/cache/mpl
        run: |
          umask 077
          phase_log="$RUNNER_TEMP/checker-seed-$CHECKER_SHARD.log"
          : > "$phase_log"
          printf 'START phase=seed shard=%s utc=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)"
          finish() {
            phase_rc=$?
            trap - EXIT
            printf 'END phase=seed shard=%s utc=%s exit=%s bytes=%s sha256=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)" "$phase_rc" "$(wc -c < "$phase_log")" "$(sha256sum -- "$phase_log" | cut -d ' ' -f1)"
            exit "$phase_rc"
          }
          trap finish EXIT
          timeout --signal=TERM --kill-after=15s 270s python -B tools/provision.py --seed > "$phase_log" 2>&1
      - name: Collect authoritative native nodes
        timeout-minutes: 3
        shell: bash
        working-directory: ${{ runner.temp }}/checker-runtime
        env:
          TMPDIR: ${{ runner.temp }}/checker-runtime/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/checker-runtime/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/checker-runtime/cache/config
          MPLCONFIGDIR: ${{ runner.temp }}/checker-runtime/cache/mpl
        run: |
          umask 077
          phase_log="$RUNNER_TEMP/checker-collect-$CHECKER_SHARD.log"
          : > "$phase_log"
          printf 'START phase=collect shard=%s utc=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)"
          finish() {
            phase_rc=$?
            trap - EXIT
            printf 'END phase=collect shard=%s utc=%s exit=%s bytes=%s sha256=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)" "$phase_rc" "$(wc -c < "$phase_log")" "$(sha256sum -- "$phase_log" | cut -d ' ' -f1)"
            exit "$phase_rc"
          }
          trap finish EXIT
          timeout --signal=TERM --kill-after=15s 150s python -B tools/ci.py collect > "$phase_log" 2>&1
      - name: Run native shard ${{ matrix.shard }}
        timeout-minutes: 15
        shell: bash
        working-directory: ${{ runner.temp }}/checker-runtime
        env:
          TMPDIR: ${{ runner.temp }}/checker-runtime/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/checker-runtime/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/checker-runtime/cache/config
          MPLCONFIGDIR: ${{ runner.temp }}/checker-runtime/cache/mpl
        run: |
          umask 077
          phase_log="$RUNNER_TEMP/checker-native-$CHECKER_SHARD.log"
          : > "$phase_log"
          printf 'START phase=native shard=%s utc=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)"
          finish() {
            phase_rc=$?
            trap - EXIT
            printf 'END phase=native shard=%s utc=%s exit=%s bytes=%s sha256=%s\n' "$CHECKER_SHARD" "$(date -u +%FT%TZ)" "$phase_rc" "$(wc -c < "$phase_log")" "$(sha256sum -- "$phase_log" | cut -d ' ' -f1)"
            exit "$phase_rc"
          }
          trap finish EXIT
          timeout --signal=TERM --kill-after=15s 870s python -B tools/ci.py run --shard "$CHECKER_SHARD" > "$phase_log" 2>&1
      - name: Seal current-attempt native evidence
        if: always()
        run: |
          cd "$RUNNER_TEMP/checker-runtime"
          python -B tools/ci.py seal --shard ${{ matrix.shard }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/checker-runtime/evidence/native/*.json
          if-no-files-found: error
  regression:
    if: always()
    needs: [fast-gate, focused]
    runs-on: ubuntu-latest
    env:
      CHECKER_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Verify aggregate job checkout
        run: |
          test "$(git rev-parse HEAD)" = "$CHECKER_TESTED_HEAD"
          test "$(git rev-parse --is-shallow-repository)" = false
          test -z "$(git status --porcelain=v1)"
          echo "CHECKER_CHECKOUT_PROOF=$RUNNER_TEMP/checker-checkout.json" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -B tools/ci.py checkout
      - name: Fail-closed event and dependency gate
        run: python -B tools/ci.py gate
      - uses: actions/download-artifact@v8.0.2
        if: github.event_name == 'pull_request'
        with:
          pattern: native-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .runtime/native
      - run: python -B tools/ci.py certify --evidence .runtime/native
        if: github.event_name == 'pull_request'
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: certificate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .runtime/native/certificate.json
            .runtime/native/certificate.sha256
          if-no-files-found: error
